name: Publish to npm

# Runs only when a GitHub release is published. Authentication uses npm trusted
# publishing (OIDC): no npm token is stored in this repository. Configure the
# trusted publisher on npmjs.com for this repository and this workflow file
# (publish.yml) before the first release.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: The release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: pnpm build
      - run: npm publish --provenance --access public
