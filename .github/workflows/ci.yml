name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Packed CLI runs
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/ground-truth-seo-*.tgz
          npx ground-truth-seo --version
          npx ground-truth-seo evaluate "$GITHUB_WORKSPACE/fixtures/golden/broken-links/snapshot.json" --max-pages 20 --out out
          cmp out/report.json "$GITHUB_WORKSPACE/fixtures/golden/broken-links/report.json"

  determinism:
    # PRODUCT.md §6: environment and platform independence of report.json.
    name: Determinism (${{ matrix.os }}, TZ=${{ matrix.tz }}, LANG=${{ matrix.lang }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tz: [UTC, Pacific/Kiritimati, America/St_Johns]
        lang: [C.UTF-8, tr_TR.UTF-8]
    env:
      TZ: ${{ matrix.tz }}
      LANG: ${{ matrix.lang }}
      LC_ALL: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run fixtures/golden.test.ts fixtures/baseline.test.ts fixtures/acceptance.test.ts
